<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up · DealerVexa</title>
<meta name="description" content="Start your DealerVexa account: dealer website, CRM, DMS, automotive marketing and AI photo studio.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M7 8h7c5 0 8 3 8 8s-3 8-8 8H7zm4 4v8h3c2 0 4-1 4-4s-2-4-4-4z' fill='%23d7dade'/%3E%3Cpath d='M18 8h4l2 9 4-9h2l-6 16h-2z' fill='%23e11d2a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
:root{--v:#e11d2a;--p:#9b0f18;--ink:#0a0a0c;--muted:#5f6068;--line:#e6e6ea;--bg:#f6f6f7}
.dvlogo{height:40px;width:auto;display:block}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,Arial,sans-serif}
a{color:var(--v)}
header{background:var(--ink);color:#fff}
header .w{display:flex;align-items:center;gap:10px;height:68px}
.vx{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--v),var(--p));font-weight:800}
header b{font-size:20px}
header a{margin-left:auto;color:#cfcbe4;text-decoration:none;font-weight:600}
.w{max-width:980px;margin:0 auto;padding:0 16px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:36px 0 8px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 22px}
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.steps span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input,select{font:inherit;color:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}
input:focus{outline:2px solid var(--v);border-color:var(--v)}
.btn{font:700 16px Inter,Arial,sans-serif;border:0;border-radius:10px;padding:14px 24px;cursor:pointer;background:linear-gradient(135deg,var(--v),var(--p));color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.tp{border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:#fff;text-align:left;font:inherit}
.tp.on{border-color:var(--v);box-shadow:0 0 0 3px rgba(225,29,42,.15)}
.tp b{display:block;margin:8px 2px 2px}
.tp small{color:var(--muted);display:block;margin:0 2px 4px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.plan{border:2px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:#fff;text-align:left;font:inherit}
.plan.on{border-color:var(--v);box-shadow:0 0 0 3px rgba(225,29,42,.15)}
.plan .pr{font-size:34px;font-weight:800;margin:6px 0}.plan .pr small{font-size:15px;color:var(--muted);font-weight:500}
.plan p{color:var(--muted);margin:0;font-size:14px}
.wal{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wal code{font-size:13px;overflow-wrap:anywhere;background:var(--bg);padding:6px 8px;border-radius:6px}
@media (max-width:600px){.wal{grid-template-columns:1fr}}
.err{color:#c8141b;font-weight:600;min-height:1.5em}
.ok{color:#1f8a4c;font-weight:600}
.done{text-align:center;padding:40px 22px}
.done .big{font-size:56px}
</style>
</head>
<body>
<header><div class="w"><a href="/dealervexa/" aria-label="DealerVexa"><img class="dvlogo" src="/img/dealervexa-logo.svg" alt="DealerVexa" onerror="this.onerror=null;this.src='/img/dealervexa-logo.svg'"></a><a href="/templates">See the templates</a><a href="/login" style="margin-left:18px">Log in</a></div></header>
<main class="w">
  <h1>Start your DealerVexa account</h1>
  <p class="lead">Dealer website, CRM, DMS, automotive marketing and AI photo studio, all in one place. Takes 3 minutes.</p>
  <div class="steps" id="steps"></div>
  <div id="step"></div>
  <p class="err" id="err"></p>
  <div style="height:60px"></div>
</main>
<script type="module" src="/signup.js"></script>
<p style="text-align:center;color:#5f6068;font-size:13px;margin:30px 0">By signing up you agree to the <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>. Questions? <a href="/contact">Contact us</a>.</p>
</body>
</html>
