<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Website admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <img id="loginLogo" alt="" hidden>
    <h1 id="loginName">Website admin</h1>
    <p>Enter your password to manage your cars and website.</p>
    <input type="password" id="loginPw" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button class="b primary" type="submit">Log in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>
<div id="app" class="app" hidden>
  <aside class="side">
    <a class="logo" href="#/cars"><img id="sideLogo" alt="" hidden><span><b id="sideName"></b><small>WEBSITE ADMIN</small></span></a>
    <nav id="nav"></nav>
    <div class="side-ft"><a id="viewSite" target="_blank" rel="noopener">View website ↗</a><button class="linkish" id="logout" type="button">Log out</button></div>
  </aside>
  <div class="main">
    <header class="top"><button class="burger" id="burger" type="button" aria-label="Menu">☰</button><div style="flex:1"></div><a class="b sm primary" href="#/cars/new">+ Add car</a></header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/t/admin.js"></script>
</body>
</html>
