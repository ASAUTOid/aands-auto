[build]
  publish = "site"
  functions = "netlify/functions"

[[redirects]]
  from = "/w/:slug/admin"
  to = "/t/admin.html"
  status = 200

[[redirects]]
  from = "/w/*"
  to = "/t/site.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
